# TDID-THR-014 Unlinkability-policy failure from stable credential material reuse
# Source analysis: research/candidates/CAND-20260814-OBS-GAP-THR-011-015.yaml (TDID-THR-014 row),
# CAND-20260908-CH6-THR-014-REAFFIRMED.yaml (unchanged definition; the OBS-GAP row adds the common-observer
# exposure condition, which this rule follows); primary sources OpenID4VP 1.0 15.5, OpenID4VCI 1.0 15.4.1,
# VC Data Model 2.0 8.4/8.5, Bitstring Status List 1.0 6.2.
# Two producers joined on request_ref, for each presentation or issuance output:
#   wallet WALLET_RESPONSE_SENT (event type in _common, outcome none): request_ref, session_ref,
#     stable_material_ref, material_profile, observer_domain_ref, presentation_response_delivery
#   verifier PRESENTATION_DECISION: request_ref (the verifier's own record that it received the response)
#   wallet WALLET_CREDENTIAL_REQUEST_SENT (outcome none): request_ref, session_ref, stable_material_ref,
#     material_profile, observer_domain_ref
#   issuer ISSUANCE_DECISION: request_ref (the issuer's own record that it received the credential request)
# request_ref (common vocabulary) is a joint ref here with two key holders: the wallet and the verifier for a
# presentation, the wallet and the issuer for a credential request. Their T-DID collectors compute it over the
# same request object bytes (the presentation request object, or the Credential Request) under one commitment
# key they share for this relationship (one key per wallet-verifier or wallet-issuer relationship, not per
# request); the value changes per request because every request object carries a fresh nonce (the
# presentation request's nonce, the Issuer's c_nonce in the Credential Request's key proof), so it joins the
# two records of one exchange and does not link exchanges.
# Material equality is computed wallet-locally by the T-DID instance that holds the wallet's keys; the
# verifier and the issuer never compute or receive material commitments. "Received" is established only by
# the receiving component's own record, never by the wallet's event. Presentation and issuance outputs are
# compared with each other when their material_profile is the same (for example the holder-binding key sent
# in a key proof and later disclosed in a presentation).
threat: TDID-THR-014
event_types:
  WALLET_CREDENTIAL_REQUEST_SENT:
    produced_by: [wallet]
    meaning: The wallet sent one Credential Request (OpenID4VCI) to the credential endpoint of an Issuer. An action record (outcome none; error = whether it was sent is not established); receipt is the issuer's ISSUANCE_DECISION for the same request_ref.
refs:
  stable_material_ref:
    produced_by: [wallet]
    meaning: >-
      Wallet-local keyed commitment over the policy-designated stable material sent in one presentation or one
      Credential Request (for example issuer signature, holder-binding key, credential identifier or status
      entry; in a Credential Request, the holder key in its key proof), canonicalized under material_profile.
      The key is generated by the wallet's T-DID collector for one unlinkability-policy window and destroyed
      at window close.
    reveals: Whether two outputs of this wallet (presentations or credential requests) carried identical designated material within one window (equality only); never the material.
  observer_domain_ref:
    produced_by: [wallet]
    meaning: >-
      Wallet-local keyed commitment, same key lifecycle, over the observer that received the presentation or
      the Credential Request (verifier or issuer), or the cooperating evidence domain the unlinkability policy
      assigns that observer to (the observer itself when no domain is declared).
    reveals: Whether two outputs went to the same observer or policy-declared cooperating domain (for example two cooperating issuers).
facts:
  material_profile:
    type: string
    produced_by: [wallet]
    meaning: >-
      Policy name of the designated material feature and its canonicalization (for example
      issuer_signature/jws-compact-v1). stable_material_ref values are comparable only under the same profile.
    reveals: Which designated feature was compared, not its value.
checks:
  presentation_response_delivery:
    produced_by: [wallet]
    meaning: >-
      The wallet's transport confirmed that the response was delivered to the verifier's response endpoint
      (for example HTTP success on direct_post). pass = delivered; fail = not delivered. Only fail is used to
      decide: receipt is established by the verifier's own record.
policy_params:
  unlinkability_required:
    type: boolean
    example: false
    produced_by: [wallet]
    meaning: >-
      The policy under which the presentation or credential request was made requires it to be unlinkable from
      other outputs made under the same requirement. Stable material is not universally prohibited; a deployment choice.
      Unset = unknown.
  unlinkability_exception:
    type: boolean
    example: false
    produced_by: [wallet]
    meaning: >-
      A versioned policy exception permits stable reuse for this output (for example the same allowed
      context or an explicitly public correlation); false = no exception. Unset = unknown.
