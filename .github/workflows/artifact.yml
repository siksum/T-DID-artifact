name: Reproduce artifact
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: make install
      - run: make verify
      - run: make monpoly
      - run: make test
      - run: make reproduce
